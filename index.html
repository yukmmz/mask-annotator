<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mask Annotator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 上部ツールバー -->
    <header id="toolbar">
      <!-- アプリ名＋バージョン（ツールバー左端）。値は app.js の APP_VERSION が単一情報源 -->
      <div class="app-brand">
        <h1 class="app-title">Mask Annotator</h1>
        <span id="appVersion" class="app-version"></span>
      </div>
      <div class="group">
        <button id="btnLoadFrames" class="primary" data-i18n="loadFrames">画像を読込</button>
        <button id="btnLoadBg" data-i18n="loadBg">背景</button>
        <span id="bgState" class="tag off">bg:なし</span>
        <label><span data-i18n="objLabel">対象</span>
          <input id="objInput" type="text" list="objSuggest" placeholder="必須"
                 data-i18n-placeholder="objPlaceholder"
                 inputmode="latin" autocapitalize="off" autocomplete="off"
                 enterkeyhint="done" />
        </label>
        <button id="btnObjOK" data-i18n="ok">OK</button>
        <datalist id="objSuggest">
          <option value="robot"></option>
          <option value="box"></option>
          <option value="mech"></option>
          <option value="wing"></option>
        </datalist>
        <button id="btnExport" class="primary" data-i18n="exportZip">ZIP出力</button>
        <span class="menu-wrap">
          <button id="btnMore" title="その他のツール" data-i18n="more" data-i18n-title="moreTitle">その他 &#8943;</button>
          <!-- 低頻度コントロール（タップで開くポップオーバー。画面は狭めない） -->
          <div id="moreMenu" hidden>
            <button id="btnImport" data-i18n="importMasks">マスク読込</button>
            <label><span data-i18n="packLabel">pack(ZIP名)</span> <input id="packName" type="text" placeholder="背景から自動・手入力可"
                   data-i18n-placeholder="packPlaceholder"
                   enterkeyhint="done" autocapitalize="off" autocomplete="off" /></label>
            <button id="btnPackOK" data-i18n="ok">OK</button>
            <button id="btnCopyPrev" data-i18n="copyPrev">前マスクをコピー</button>
            <button id="btn3pt" data-i18n="threePt">3点(翼)</button>
            <button id="btnAuto">Auto(link)</button>
            <button id="btnClear" data-i18n="clear">Clear</button>
            <button id="btnDiff" data-i18n="showDiff">Diff表示</button>
          </div>
        </span>
      </div>
      <!-- Common header controls (same in every yukmmz.github.io app): ⛶ then ⚙ at the right end. -->
      <div class="group tb-right">
        <button id="fullscreen-btn" class="btn-icon" type="button"
                data-i18n-title="c.fullscreen" data-i18n-aria-label="c.fullscreen"
                title="全画面表示" aria-label="全画面表示">&#x26F6;</button>
        <button id="settings-btn" class="btn-icon" type="button"
                data-i18n-title="c.settings" data-i18n-aria-label="c.settings"
                title="設定" aria-label="設定" aria-expanded="false">&#x2699;</button>
      </div>
    </header>

    <!-- 常時表示クイックバー（折りたたんでも残す頻用コントロール） -->
    <div id="quickbar">
      <button id="btnPrev">◀</button>
      <span id="frameLabel" class="tag">- / -</span>
      <button id="btnNext">▶</button>
      <button id="btnFit">Fit</button>
      <button id="btnLasso" title="囲んだ範囲の外側をADD/REMOVE"
              data-i18n="lasso" data-i18n-title="lassoTitle">外側</button>
      <!-- Auto(link)のピン留めON時のみ表示。Auto実行/適用をクイックバーに常駐 -->
      <span id="autoQuick" class="group" hidden>
        <button id="btnAutoRunQ" class="primary" data-i18n="autoRun">Auto実行</button>
        <button id="btnAutoApplyQ" data-i18n="autoApplyQ">Auto適用</button>
      </span>
      <label>brush <input id="sBrush" type="range" min="2" max="60" step="1" value="8" />
        <span id="vBrush">8</span>px</label>
      <label>sim <input id="sSim" type="range" min="0" max="120" step="1" value="20" />
        <span id="vSim">20</span></label>
      <label>reach <input id="sReach" type="range" min="0" max="200" step="1" value="30" />
        <span id="vReach">30</span>px</label>
      <span id="status" class="status"></span>
      <!-- 右端に寄せる頻用ボタン（一番右=ADD/REMOVE, その左=Undo） -->
      <div class="group qright">
        <button id="btnUndo">Undo</button>
        <button id="btnMode" class="mode-add">ADD</button>
      </div>
    </div>

    <!-- 移動/回転バー（前マスクコピー中のみ表示） -->
    <div id="transformBar" hidden>
      <span class="tag" data-i18n="transformTag">マスク移動/回転</span>
      <span id="rotReadout" class="tag">0&deg;</span>
      <button id="btnTransformApply" class="primary" data-i18n="apply">確定</button>
      <button id="btnTransformCancel" data-i18n="cancel">取消</button>
      <span class="barhint" data-i18n="transformHint">Pencilでドラッグ=移動 / 上の&#9711;ハンドルをドラッグ=回転</span>
    </div>

    <!-- 翼3点(楕円)バー（3点モード中のみ表示） -->
    <div id="threePointBar" hidden>
      <span class="tag" data-i18n="threeTag">翼3点(楕円)</span>
      <button id="btn3ptUndo" data-i18n="threeUndo">1点戻す</button>
      <button id="btn3ptClear" data-i18n="threeClear">クリア</button>
      <button id="btn3ptApply" class="primary" data-i18n="apply">確定</button>
      <button id="btn3ptCancel" data-i18n="cancel">取消</button>
      <span class="barhint" data-i18n="threeHint">順: center &rarr; tip &rarr; trailing をタップ（点の近くからドラッグで調整可）</span>
    </div>

    <!-- 自動シード(link)バー（Auto(link)トグルで表示） -->
    <div id="autoBar" hidden>
      <span class="tag">Auto(link)</span>
      <button id="btnAutoPin" title="Auto実行/Auto適用をクイックバーに常駐" data-i18n-title="autoPinTitle">&#128204;</button>
      <label>motion <input id="aMotion" type="range" min="0" max="150" step="1" value="45" /><span id="vMotion">45</span></label>
      <label>white <input id="aWhite" type="range" min="0" max="255" step="1" value="110" /><span id="vWhite">110</span></label>
      <label>yellow <input id="aYellow" type="range" min="0" max="120" step="1" value="35" /><span id="vYellow">35</span></label>
      <label>min-area <input id="aMinArea" type="range" min="0" max="3000" step="50" value="400" /><span id="vMinArea">400</span></label>
      <button id="btnAutoRun" class="primary" data-i18n="autoRun">Auto実行</button>
      <button id="btnAutoApply" data-i18n="autoApply">適用</button>
      <button id="btnAutoClose" data-i18n="c.close">閉じる</button>
    </div>

    <!-- 描画エリア -->
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="hint" data-i18n-html="hint">「画像を読込」でキーフレーム(frame_*.png)と背景を選択。<br />
        Apple Pencilで描画 / 指でズーム・移動。</div>
      <div id="frameName" class="frame-name"></div>
      <button id="btnChrome" class="chrome-toggle" type="button">隠す &#9650;</button>
    </main>
  </div>

  <!-- Settings sheet. The common rows (language, share, changelog, other apps,
       clear data) are the same in every yukmmz.github.io app. This app has no
       app-wide settings of its own (tools stay in the ⋯ menu). -->
  <div id="sheet-backdrop" class="backdrop" hidden></div>

  <section id="settings-panel" class="sheet" hidden data-i18n-aria-label="c.settings" aria-label="設定">
    <div class="sheet-head">
      <h2 class="sheet-title" data-i18n="c.settings">設定</h2>
      <button id="settings-close" class="btn-icon" type="button"
              data-i18n-aria-label="c.close" aria-label="閉じる">&#x2715;</button>
    </div>

    <div class="sheet-row">
      <span class="sheet-label" data-i18n="c.language">言語</span>
      <select id="lang-select" data-i18n-aria-label="c.language" aria-label="言語">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="sheet-row">
      <span class="sheet-label" data-i18n="c.share">共有</span>
      <button id="qrBtn" type="button" data-i18n="c.showQr">QR コードを表示</button>
    </div>

    <div class="sheet-row">
      <span class="sheet-label" data-i18n="c.changelog">更新履歴</span>
      <button id="changelogBtn" type="button" data-i18n="c.showChangelog">表示</button>
    </div>

    <div class="sheet-row">
      <span class="sheet-label" data-i18n="c.otherApps">他のアプリ</span>
      <a id="otherAppsLink" class="linkbtn" href="https://yukmmz.github.io/" target="_blank" rel="noopener"
         data-i18n="c.openPortal">アプリ一覧を開く</a>
    </div>

    <div class="sheet-row">
      <span class="sheet-label" data-i18n="c.data">データ</span>
      <button id="clearDataBtn" class="btn-danger" type="button" data-i18n="c.clearData">保存データを消す</button>
    </div>
  </section>

  <!-- QRオーバーレイ: アプリURL（左）とソースリポジトリURL（右）を読取れるQRで表示 -->
  <div id="qrOverlay" hidden>
    <div class="qrcard" role="dialog" data-i18n-aria-label="c.showQr" aria-label="QR コードを表示">
      <div class="qrrow">
        <div class="qrcol">
          <div class="qrlabel">App</div>
          <img class="qrImg" src="qr.svg" alt="QR code for the app URL" />
          <div class="qrurl" id="qrUrl"></div>
        </div>
        <div class="qrcol">
          <div class="qrlabel">Source</div>
          <img class="qrImg" src="src-qr.svg" alt="QR code for the source repository" />
          <div class="qrurl" id="qrSrcUrl"></div>
        </div>
      </div>
      <button id="qrClose" type="button" data-i18n="c.close">閉じる</button>
    </div>
  </div>

  <!-- 更新履歴: 新しい順。中身は strings.js の CHANGELOG から組み立てる -->
  <div id="changelogOverlay" hidden>
    <div class="qrcard changelog-card" role="dialog" data-i18n-aria-label="c.changelog" aria-label="更新履歴">
      <h2 class="changelog-title" data-i18n="c.changelog">更新履歴</h2>
      <div id="changelogList" class="changelog-list"></div>
      <button id="changelogClose" type="button" data-i18n="c.close">閉じる</button>
    </div>
  </div>

  <!-- 複数ファイル選択（非表示） -->
  <input id="fileFrames" type="file" accept="image/*" multiple hidden />
  <input id="fileBg" type="file" accept="image/*" hidden />
  <!-- マスクZIP取り込み（再開） -->
  <input id="fileImport" type="file" accept=".zip" multiple hidden />

  <!-- JSZip（ZIP生成）。MVP1はCDN、MVP2でオフライン用にvendor化予定 -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="brush.js"></script>
  <script src="mask_io.js"></script>
  <script src="mask_transform.js"></script>
  <script src="wing_ellipse.js"></script>
  <script src="linkseed.js"></script>
  <script src="lasso.js"></script>
  <script src="i18n.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
